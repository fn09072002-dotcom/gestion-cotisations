<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau d'audit — Gestion des Cotisations</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      screens: { 'xs': '420px' },
      colors: {
        brand: { DEFAULT:'#40206A', 700:'#2F1750', 50:'#F4EEFA' },
        brandgreen: { DEFAULT:'#1E8449', 600:'#196F3D', 50:'#EAF7EE' },
        navy: { DEFAULT:'#241468' },
        danger: { DEFAULT:'#E5473C', soft:'#F1A19A' },
        badge: { bg:'#C8ECD2', text:'#1A7A3D', pendingbg:'#FFE1B3', pendingtext:'#96591A' }
      },
      fontFamily: { display:['"Poppins"','sans-serif'], body:['Inter','sans-serif'] }
    } }
  }
</script>

</head>
<body class="font-body text-slate-900 bg-slate-50 min-h-screen overflow-x-hidden">

<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-brand flex items-center justify-center font-display font-bold text-white shrink-0">C</div>
      <span class="font-display text-lg sm:text-xl font-bold tracking-tight text-slate-900 truncate">Cotise</span>
    </div>
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <span class="text-xs sm:text-sm text-slate-500 hidden md:inline">baila wane &middot; Coach Superviseur</span>
      <a href="../login.html" class="text-xs sm:text-sm text-danger hover:text-danger-soft transition whitespace-nowrap">Déconnexion</a>
    </div>
  </div>
</header>
<nav class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center gap-4 sm:gap-6 border-b border-slate-200 overflow-x-auto bg-white [-webkit-overflow-scrolling:touch]">
  <a href="dashboard.html" class="py-3 text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 border-b-2 border-transparent text-slate-500 hover:text-slate-700">Dashboard</a>
  <a href="audit.html" class="py-3 text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 border-b-2 border-brand text-brand">Tableau d'audit</a>
</nav>

<main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
<h1 class="font-display text-2xl font-bold mb-1">Tableau d'audit</h1>
<p class="text-slate-500 mb-6">Lecture seule — transparence financière.</p>

<input type="text" placeholder="rechercher d'audit" class="w-full max-w-xl border border-slate-200 bg-white rounded-lg px-4 py-2.5 text-sm mb-6">

<div class="bg-white border border-slate-200 rounded-2xl p-5 overflow-x-auto max-w-xl">
  <table class="w-full text-sm min-w-[380px]">
    <thead>
      <tr class="border-b-2 border-danger-soft">
        <th class="text-left py-2">noms</th><th class="text-left py-2">semaine payé</th><th class="text-left py-2">montant</th><th class="text-left py-2">retard</th>
      </tr>
    </thead>
    <tbody>
            <tr class="border-b border-danger-soft"><td class="py-2.5">fatou</td><td class="py-2.5">7</td><td class="py-2.5">7000</td><td class="py-2.5">0</td></tr>
            <tr class="border-b border-danger-soft"><td class="py-2.5">daouda</td><td class="py-2.5">6</td><td class="py-2.5">6000</td><td class="py-2.5">1</td></tr>
            <tr class="border-b border-danger-soft"><td class="py-2.5">rama</td><td class="py-2.5">6</td><td class="py-2.5">6000</td><td class="py-2.5">1</td></tr>
            <tr class="border-b border-danger-soft"><td class="py-2.5">maria</td><td class="py-2.5">8</td><td class="py-2.5">8000</td><td class="py-2.5">0</td></tr>
    </tbody>
  </table>
</div>
<p class="text-xs text-slate-400 mt-4">Audit en lecture seule pour le coach superviseur.</p>
</main>

</body>
</html>
